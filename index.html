<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Día de la Novia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Jost:wght@300;400;500&family=Parisienne&display=swap" rel="stylesheet">
<style>
  :root{
    --wine-deep:#1a0512;
    --wine-mid:#3a0e26;
    --wine-glow:#6e1c3f;
    --gold:#d9b26a;
    --gold-light:#f3dea3;
    --blush:#f6c9d3;
    --rose:#e07f95;
    --ivory:#fbf1e6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 20%, var(--wine-glow) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, var(--wine-mid) 0%, var(--wine-deep) 70%);
    background-color:var(--wine-deep);
    font-family:'Jost', sans-serif;
    display:flex; align-items:center; justify-content:center;
    perspective:1400px;
  }
  #particles{
    position:fixed; inset:0; pointer-events:none; z-index:1;
  }
  .p-heart{
    position:absolute; bottom:-10%; color:var(--rose);
    opacity:.55; will-change:transform; filter:drop-shadow(0 0 6px rgba(224,127,149,.5));
    animation-name:rise, sway; animation-timing-function:linear, ease-in-out;
    animation-iteration-count:infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) rotate(0deg); }
    100%{ transform:translateY(-120vh) rotate(20deg); }
  }
  @keyframes sway{
    0%,100%{ margin-left:0; }
    50%{ margin-left:40px; }
  }

  .scene{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center; gap:28px;
    transform-style:preserve-3d;
  }

  .eyebrow{
    letter-spacing:.35em; text-transform:uppercase; font-size:11px;
    color:var(--gold-light); opacity:.75; font-weight:400;
  }

  /* ENVELOPE */
  .envelope-wrap{
    position:relative; width:300px; height:190px; transform-style:preserve-3d;
  }
  .envelope-body{
    position:absolute; inset:0; border-radius:6px;
    background:linear-gradient(160deg,#f4e6d2,#e9d3ad 55%,#dcc190);
    box-shadow:0 30px 60px -15px rgba(0,0,0,.65), 0 0 0 1px rgba(217,178,106,.4);
    overflow:hidden;
  }
  .envelope-body::before{
    content:''; position:absolute; inset:0;
    background:
      linear-gradient(135deg, transparent 49.3%, rgba(0,0,0,.08) 50%, transparent 50.7%),
      linear-gradient(-135deg, transparent 49.3%, rgba(0,0,0,.08) 50%, transparent 50.7%);
  }
  .flap{
    position:absolute; top:0; left:0; width:100%; height:100%;
    transform-origin:top center; transform-style:preserve-3d;
    transition:transform 1.1s cubic-bezier(.6,.1,.2,1);
    clip-path:polygon(0 0,100% 0,50% 62%);
    background:linear-gradient(200deg,#f7ecd9,#e2c690 60%,#cca866);
    z-index:5;
    box-shadow:inset 0 -12px 20px -10px rgba(0,0,0,.25);
  }
  .envelope-wrap.open .flap{ transform:rotateX(178deg); }

  .letter{
    position:absolute; left:8%; bottom:6px; width:84%; height:88%;
    z-index:3; transform-origin:bottom center;
    transform:translateY(4%) scale(.94);
    transition:transform 1.1s cubic-bezier(.2,.8,.2,1) .35s, opacity .6s .35s;
    opacity:0;
  }
  .envelope-wrap.open .letter{
    z-index:6; opacity:1;
    transform:translateY(-170px) scale(1);
  }

  .card{
    width:100%; height:100%;
    background:
      linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.02)),
      linear-gradient(175deg,#241023,#3a1030 60%,#2a0c22);
    border:1px solid rgba(217,178,106,.5);
    border-radius:14px;
    padding:26px 22px;
    text-align:center;
    box-shadow:0 25px 60px -10px rgba(0,0,0,.7), inset 0 0 40px rgba(217,178,106,.06);
    position:relative; overflow:hidden;
    transform-style:preserve-3d;
    transition:transform .15s ease-out;
    backdrop-filter:blur(2px);
  }
  .card .sheen{
    position:absolute; inset:-40%; pointer-events:none;
    background:radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(243,222,163,.22), transparent 45%);
    mix-blend-mode:screen;
  }
  .card-heart{
    font-size:34px; color:var(--rose);
    filter:drop-shadow(0 6px 10px rgba(224,127,149,.5));
    animation:beat 1.6s ease-in-out infinite;
    transform:translateZ(30px);
  }
  @keyframes beat{
    0%,100%{ transform:translateZ(30px) scale(1); }
    50%{ transform:translateZ(30px) scale(1.15); }
  }
  h1{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:500;
    color:var(--ivory); font-size:18px; margin:14px 0 4px; line-height:1.35;
    transform:translateZ(20px);
  }
  .script{
    font-family:'Parisienne', cursive; font-size:30px; color:var(--gold-light);
    display:block; margin-top:-2px; transform:translateZ(20px);
  }
  p{
    color:#e9d9df; font-size:14.5px; line-height:1.6; font-weight:300;
    margin:14px 4px 6px; transform:translateZ(14px);
  }
  .signature{
    margin-top:14px; font-family:'Cormorant Garamond', serif; font-style:italic;
    color:var(--gold-light); font-size:15px; opacity:.9; transform:translateZ(14px);
  }
  .rule{
    width:40px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent);
    margin:10px auto; opacity:.8;
  }

  /* SEAL */
  .seal-wrap{
    position:absolute; left:50%; top:-2px; transform:translate(-50%,-50%);
    z-index:8; cursor:pointer;
  }
  .orbit{
    position:absolute; inset:-26px; pointer-events:none;
  }
  .orbit span{
    position:absolute; top:50%; left:50%; font-size:11px; color:var(--rose); opacity:.8;
    animation:orbitspin 6s linear infinite;
  }
  .orbit span:nth-child(2){ animation-duration:8s; animation-direction:reverse; font-size:9px;}
  .orbit span:nth-child(3){ animation-duration:10s; font-size:8px;}
  @keyframes orbitspin{
    from{ transform:rotate(0deg) translateX(34px) rotate(0deg); }
    to{ transform:rotate(360deg) translateX(34px) rotate(-360deg); }
  }
